aid: cloudprinter
url: https://raw.githubusercontent.com/api-evangelist/cloudprinter/refs/heads/main/apis.yml
name: Cloudprinter
kind: company
description: Cloudprinter.com is a global print-on-demand and print-fulfillment API
  network connecting buyers to 170+ print partners worldwide. The CloudCore REST API
  lets developers fetch product catalogs, request real-time price and shipping quotes,
  submit and manage print orders, and receive production and shipment events via
  CloudSignal webhooks.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Print on Demand
- Print Fulfillment
- Printing
- Orders
- Logistics
created: '2026-06-25'
modified: '2026-06-25'
specificationVersion: '0.19'
apis:
- aid: cloudprinter:cloudprinter-orders-api
  name: Cloudprinter Orders API
  tags:
  - Orders
  - Fulfillment
  - Printing
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.cloudprinter.com/client/cloudprinter-core-api-v1-0/
  baseURL: https://api.cloudprinter.com/cloudcore/1.0
  properties:
  - url: https://docs.cloudprinter.com/client/cloudprinter-core-api-v1-0/
    type: Documentation
  - url: https://docs.cloudprinter.com/client/cloudprinter-core-api-v1-0/
    type: APIReference
  - url: openapi/cloudprinter-openapi.yml
    type: OpenAPI
  description: Create, list, retrieve, cancel, and audit print orders. Orders carry
    items, addresses, shipping levels, options, and file references, and are submitted
    as JSON POST requests with the CloudCore apikey in the body.
- aid: cloudprinter:cloudprinter-products-pricing-api
  name: Cloudprinter Products & Pricing API
  tags:
  - Products
  - Catalog
  - Pricing
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.cloudprinter.com/client/cloudprinter-core-api-v1-0/
  baseURL: https://api.cloudprinter.com/cloudcore/1.0
  properties:
  - url: https://docs.cloudprinter.com/client/how-to-check-prices
    type: Documentation
  - url: https://docs.cloudprinter.com/client/cloudprinter-core-api-v1-0/
    type: APIReference
  - url: openapi/cloudprinter-openapi.yml
    type: OpenAPI
  description: List products enabled for the account and retrieve detailed product
    specifications, available options, and pricing via the products and products/info
    endpoints.
- aid: cloudprinter:cloudprinter-quotes-api
  name: Cloudprinter Quotes API
  tags:
  - Quotes
  - Pricing
  - Shipping
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.cloudprinter.com/client/how-to-check-prices
  baseURL: https://api.cloudprinter.com/cloudcore/1.0
  properties:
  - url: https://docs.cloudprinter.com/client/how-to-check-prices
    type: Documentation
  - url: https://docs.cloudprinter.com/client/cloudprinter-core-api-v1-0/
    type: APIReference
  - url: openapi/cloudprinter-openapi.yml
    type: OpenAPI
  description: Request real-time quotes for a list of items returning product prices,
    shipping options, and shipping prices. Each quote carries a unique hash valid
    for 48 hours that can be referenced when placing an order.
- aid: cloudprinter:cloudprinter-signal-webhooks-api
  name: Cloudprinter Signal Webhooks API
  tags:
  - Webhooks
  - Signals
  - Events
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.cloudprinter.com/client/cloudsignal-webhooks
  baseURL: https://api.cloudprinter.com/cloudcore/1.0
  properties:
  - url: https://docs.cloudprinter.com/client/cloudsignal-webhooks
    type: Documentation
  - url: openapi/cloudprinter-openapi.yml
    type: OpenAPI
  description: CloudSignal pushes item-based production and shipment events (order
    validated, item produced, item shipped with tracking, item error, item cancelled)
    as small JSON POSTs to a configured CloudCore API interface, retrying up to 100
    attempts over 7 days until a 200/204 is returned.
- aid: cloudprinter:cloudprinter-files-api
  name: Cloudprinter Files API
  tags:
  - Files
  - Print Files
  - Assets
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.cloudprinter.com/client/cloudprinter-core-api-v1-0/
  baseURL: https://api.cloudprinter.com/cloudcore/1.0
  properties:
  - url: https://docs.cloudprinter.com/client/cloudprinter-core-api-v1-0/
    type: Documentation
  - url: openapi/cloudprinter-openapi.yml
    type: OpenAPI
  description: Print-ready files (product, cover, book) are referenced on order items
    by type, URL, and MD5 checksum, and are returned with the same metadata on order
    info for download and verification by production.
